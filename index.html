<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{

            margin: 0;
            padding: 0;
            
        }
        .con{
            height: 500px;
            width: 800px;
            background-color: blue;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            
        }
        .box{
            height: 80%;
            width: 80%;
            background-color: skyblue;
        }
        .box1{
            height: 55%;
            width: 60%;
            background-color: blueviolet;
            border: 20px solid navy;
            margin: 20px 20px 20px 45px;
            padding: 70px 30px 30px 95px;
        }
        .box2{
            height: 80%;
            width: 80%;
            background-color: orange;
           
        }
        .margin{
            position: absolute;
            left: 47.50%;
            top: 20%;
            color: white;
        }
        .border{
            position: absolute;
            left: 47.50%;
            top: 22%;
            color:white;
        }
        .padding{
            position: absolute;
            left: 47.50%;
            top: 27%;
            color:white;
        }
        .content{
            position: absolute;
            left: 47.50%;
            top: 42%;
            color: white;
        }
        h1{
            margin-top: 5%;
        }
    </style>
</head>
<body>
    <h1 align="center">Box-Modeling</h1>
    <div class="con">
        <p class="margin">Margin</p>
        <div class="box">
            <p class="border">Border</p>
            <p class="padding">Padding</p>
            <div class="box1">
                <div class="box2">
                    <p class="content">Content</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
